$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required:
  - containers
  - workdir
  - data
  - signal
  - backgrounds
  - weight_variations
  - shape_variations
properties:
  containers:
    type: object
    additionalProperties: false
    required: [analysis, root]
    properties:
      analysis:
        type: string
        minLength: 1
      root:
        type: string
        minLength: 1
  workdir:
    type: string
    minLength: 1
  data:
    type: object
    additionalProperties: false
    required: [nevents, qcd_transfer_factor]
    properties:
      nevents:
        $ref: "#/$defs/event_chunks"
      qcd_transfer_factor:
        type: number
        exclusiveMinimum: 0
  signal:
    $ref: "#/$defs/simulated_sample"
  backgrounds:
    type: object
    additionalProperties: false
    required: [mc1, mc2]
    properties:
      mc1:
        $ref: "#/$defs/simulated_sample"
      mc2:
        $ref: "#/$defs/simulated_sample"
  weight_variations:
    type: array
    minItems: 3
    maxItems: 3
    prefixItems:
      - const: nominal
      - const: weight_var1_up
      - const: weight_var1_dn
  shape_variations:
    type: array
    minItems: 2
    maxItems: 2
    prefixItems:
      - const: shape_conv_up
      - const: shape_conv_dn
$defs:
  event_chunks:
    type: array
    minItems: 1
    items:
      type: integer
      minimum: 1
  simulated_sample:
    type: object
    additionalProperties: false
    required: [nevents, weight]
    properties:
      nevents:
        $ref: "#/$defs/event_chunks"
      weight:
        type: number
        exclusiveMinimum: 0
