name: ci

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install Pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install reana-client==0.95.0a5

      - name: Validate Snakemake workflow
        run: |
          pixi run snakemake-lint
          pixi run snakemake-dry-run

      - name: Build analysis environment image
        run:
          docker build -f environments/reana-demo-bsm-search/Dockerfile -t
          reana-demo-bsm-search:test .

      - name: Validate workflow specification file
        run: reana-client validate

      - name: Test ROOT and PyROOT versions
        run:
          docker run --rm reana-demo-bsm-search:test /bin/bash -c 'test
          "$(root-config --version)" = "6.38.04" && python3 -c "import ROOT;
          assert ROOT.gROOT.GetVersion() == \"6.38.04\""'

      - name: Test hftools Python library and commands
        run:
          docker run --rm reana-demo-bsm-search:test /bin/bash -c 'python3 -c
          "import hftools.hepdata" && hfquickplot --help >/dev/null &&
          hfhdrootcnv --help >/dev/null'

      - name: Test analysis code in the container
        run:
          docker run --rm -v "${PWD}:/workspace" -w /workspace
          reana-demo-bsm-search:test /bin/bash -c 'python3 code/generantuple.py
          sig 10 /tmp/generated.root 123 workflow/config.yaml && python3 -c
          "import ROOT; f = ROOT.TFile.Open(\"/tmp/generated.root\"); assert
          f.Get(\"ntuple\").GetEntries() == 10"'

      - name: Run containerized workflow smoke test
        run: |
          smoke_dir=$(mktemp -d)
          cp -R code workflow "${smoke_dir}/"
          sed -i 's/20000/100/g; s/40000/100/g' "${smoke_dir}/workflow/config.yaml"
          docker run --rm -v "${smoke_dir}:/workspace" -w /workspace \
            reana-demo-bsm-search:test /bin/bash -c '
              python3 -m pip install --disable-pip-version-check snakemake==9.23.1 >/dev/null &&
              snakemake --snakefile workflow/Snakefile --cores 4 --quiet progress rules
            '
          test -s "${smoke_dir}/plot/prefit.pdf"
          test -s "${smoke_dir}/plot/postfit.pdf"
          test -s "${smoke_dir}/hepdata/submission.zip"

  format-prettier:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4

      - name: Check Prettier code formatting
        run: |
          npm install prettier --global
          ./run-tests.sh --format-prettier

  format-shfmt:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell script code formatting
        run: |
          sudo apt-get install shfmt
          ./run-tests.sh --format-shfmt

  lint-commitlint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4

      - name: Install commitlint
        run: |
          npm install conventional-changelog-conventionalcommits
          npm install commitlint@latest

      - name: Check commit message compliance of the recently pushed commit
        if: github.event_name == 'push'
        run: |
          ./run-tests.sh --lint-commitlint HEAD~1 HEAD

      - name: Check commit message compliance of the pull request
        if: github.event_name == 'pull_request'
        run: |
          ./run-tests.sh --lint-commitlint ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} ${{ github.event.pull_request.number }}

  lint-markdownlint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4

      - name: Lint Markdown files
        run: |
          npm install markdownlint-cli2 --global
          ./run-tests.sh --lint-markdownlint

  lint-shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runs shell script static analysis
        run: |
          sudo apt-get install shellcheck
          ./run-tests.sh --lint-shellcheck

  lint-yamllint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint YAML files
        run: |
          pip install yamllint
          ./run-tests.sh --lint-yamllint
