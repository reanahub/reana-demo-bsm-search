[workspace]
name = "reana-demo-bsm-search"
version = "0.1.0"
description = "REANA BSM search demo workflow tooling"
authors = ["REANA <info@reana.io>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tasks]
snakemake-dry-run = "snakemake -s workflow/Snakefile --dry-run --cores 1"
workflow-dag = "dot -c && snakemake -s workflow/Snakefile --dry-run --dag --quiet | sed -n '/^digraph/,$p' | dot -Tpng > docs/workflow.png"

[dependencies]
graphviz = "*"
python = ">=3.12,<3.13"

[pypi-dependencies]
snakemake = ">=9,<10"
